<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="{% block meta_description %}Spider-Verse API - Gestiona el multiverso arácnido{% endblock %}">
    <meta name="author" content="RafaelCordero">

    <title>{% block title %}SPIDER-VERSE API{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="/estilos/style.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/estilos/logo-9ebfe9a6-257e-4f0d-9f55-05baf39d18ea.jpg" sizes="32x32">

    <!-- Additional Styles -->
    {% block extra_css %}{% endblock %}
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- Navigation Bar -->
    {% include 'header.html' %}

    <!-- Main Content -->
    <main class="flex-grow-1">
        {% block content %}
        <!-- Page content goes here -->
        {% endblock %}
    </main>

    <!-- Footer -->
    {% include 'footer.html' %}

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Additional Scripts -->
    {% block extra_js %}{% endblock %}
</body>

</html>
